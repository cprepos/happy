# The vault: Vaultwarden (github.com/dani-garcia/vaultwarden, AGPL-3.0), a
# self-hosted Bitwarden-compatible server, and the secret filler
# (browser-stack/browser/filler), which types its secrets into the agent's
# browser and serves the vault tools. Run it through make (selfhost/vault.mk):
# vault-init, vault-up, vault-status, or make stack-up for this and the browser
# stack together. See ./README.md.
#
# Host-specific values (domain, agent email, uids) come from
# ./.env (copy .env.example), which compose reads from this directory.
#
# Vaultwarden listens on 127.0.0.1:8222 only. The phone and desktop Bitwarden
# apps reach it through the host's Caddy :443 site https://${VAULT_DOMAIN}
# (caddy-vault.conf, make vault-caddy-apply), which answers /admin with 404.
# The admin panel is only ever at http://127.0.0.1:8222/admin, and only while
# ADMIN_TOKEN is set.
#
# Vaultwarden's files are in named Docker volumes (made by make vault-init,
# no sudo; external, so compose never creates or removes them):
#   happy-vault-data     uid 1991, 0700: db.sqlite3, rsa_key.pem, attachments
#   happy-vault-config   uid 1991, 0700: vaultwarden.env (0600; ORG_CREATION_USERS
#                        and, during setup only, ADMIN_TOKEN, an Argon2id PHC
#                        string) and env-backups/. Read by Vaultwarden itself
#                        (ENV_FILE), never by compose; mounted read-only.
#   happy-vault-backups  uid 1991, 0700: make vault-backup tarballs (not mounted here)
#
# 1.37.5-alpine, pinned by its index digest (checked with
# docker buildx imagetools inspect on 2026-11-04).
name: happy-vault

services:
  vaultwarden:
    image: vaultwarden/server:1.37.5-alpine@sha256:bbe684a02d6b0db54256ff88eac9754f4519284a7b26314afc241fd7d0918191
    user: "${VAULT_UID:-1991}:${VAULT_UID:-1991}"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits: { core: 0 }
    ports: ["127.0.0.1:8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/alive"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    environment:
      ENV_FILE: /etc/vaultwarden/vaultwarden.env
      DOMAIN: https://${VAULT_DOMAIN:?set VAULT_DOMAIN in selfhost/vault/.env}
      ROCKET_PORT: "8222"
      DATA_FOLDER: /data
      SIGNUPS_ALLOWED: "false"
      # No SMTP: an email invited from the admin panel or an organization can
      # register directly.
      INVITATIONS_ALLOWED: "true"
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      SENDS_ALLOWED: "false"
      EMERGENCY_ACCESS_ALLOWED: "false"
      PUSH_ENABLED: "false"
      # Caddy sets X-Real-IP to the client; the rate limits key on it.
      IP_HEADER: X-Real-IP
      LOGIN_RATELIMIT_SECONDS: "60"
      LOGIN_RATELIMIT_MAX_BURST: "5"
      ADMIN_RATELIMIT_SECONDS: "300"
      ADMIN_RATELIMIT_MAX_BURST: "3"
      LOG_LEVEL: warn
    volumes:
      # nocopy: an empty volume must keep the uid vault-init gave it, not take
      # the image's root-owned /data.
      - { type: volume, source: vault-data, target: /data, volume: { nocopy: true } }
      - vault-config:/etc/vaultwarden:ro

  # The secret filler (browser-stack/browser/filler/Dockerfile), in place of
  # the happy-filler systemd user unit it replaces. Host network, because it
  # binds 127.0.0.1:6091 itself and reaches Vaultwarden on 127.0.0.1:8222 and
  # the browser controllers on 127.0.0.1:8010 and 8100-8131. Its data is the
  # named volume happy-filler, owned by uid 1990 (one volume, because the admin
  # commands move files between its directories by rename): mounted read-only
  # as a whole (secrets/, policy.json: a directory mount, so a policy swapped
  # in by rename is seen and reloaded), with only state/ and audit/ writable
  # (volume subpaths). No host path, and no Docker socket.
  filler:
    build: ../../browser-stack/browser/filler
    image: happy-filler:local
    user: "${FILLER_UID:-1990}:${FILLER_GID:-1990}"
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits: { core: 0 }
    stop_grace_period: 10s
    depends_on:
      vaultwarden:
        condition: service_healthy
    environment:
      FILLER_HOST: 127.0.0.1
      FILLER_PORT: "6091"
      VAULT_URL: http://127.0.0.1:8222
      FILLER_CONTROLLER_PORT: "8010"
      FILLER_CONTROLLER_PORTS: 8010,8100-8131
      FILLER_HOME: /filler
      NODE_OPTIONS: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6091/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - filler:/filler:ro
      - { type: volume, source: filler, target: /filler/state, volume: { subpath: state } }
      - { type: volume, source: filler, target: /filler/audit, volume: { subpath: audit } }

  # The filler's setup commands (scripts/admin.mjs: init, token-issue,
  # controller-token-take, enroll, items, seed-policy, policy-edit, ...), run
  # once each by the vault-* and filler-* make targets with
  # `--profile admin run --rm`. Same image and uid, the whole volume writable,
  # no network beyond the host's loopback use for enroll and items.
  filler-admin:
    profiles: [admin]
    image: happy-filler:local
    user: "${FILLER_UID:-1990}:${FILLER_GID:-1990}"
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits: { core: 0 }
    entrypoint: ["node", "--disallow-code-generation-from-strings", "scripts/admin.mjs"]
    environment:
      VAULT_URL: http://127.0.0.1:8222
      FILLER_HOME: /filler
      FILLER_AGENT_EMAIL: ${VAULT_AGENT_EMAIL:-}
      NODE_OPTIONS: ""
    volumes:
      - filler:/filler

  # make vault-enroll BACKEND=<name> for a Vaultwarden backend other than
  # shared: the same enroll command, with FILLER_HOME=/enroll whose secrets/
  # is that backend's secrets/<name>/ in the volume (state/ and audit/ only
  # because the command checks they exist; read-only). FILLER_BACKEND is set
  # by make; shared enrolls through filler-admin.
  filler-enroll:
    profiles: [admin]
    image: happy-filler:local
    user: "${FILLER_UID:-1990}:${FILLER_GID:-1990}"
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits: { core: 0 }
    entrypoint: ["node", "--disallow-code-generation-from-strings", "scripts/admin.mjs"]
    environment:
      VAULT_URL: ${FILLER_ENROLL_VAULT_URL:-http://127.0.0.1:8222}
      FILLER_HOME: /enroll
      FILLER_AGENT_EMAIL: ${VAULT_AGENT_EMAIL:-}
      NODE_OPTIONS: ""
    volumes:
      - { type: volume, source: filler, target: /enroll/secrets, volume: { subpath: "secrets/${FILLER_BACKEND:-shared}" } }
      - { type: volume, source: filler, target: /enroll/state, read_only: true, volume: { subpath: state } }
      - { type: volume, source: filler, target: /enroll/audit, read_only: true, volume: { subpath: audit } }

  # The operator's side of the token handoffs and the audit (make
  # filler-token-take, filler-controller-token-give, filler-audit,
  # filler-status), in place of prep reading /srv/happy-filler directly. Its own
  # uid (FILLER_OPERATOR_UID, 1989) in the filler's group: it reads outbox/
  # (2770) and audit/ (2750) and drops into inbox/ (3730), and sees nothing
  # else of the volume. A token it takes goes to its stdout, which make
  # redirects into a 0600 file of prep's; the filler, uid 1990, accepts only an
  # inbox file someone else owns.
  filler-operator:
    profiles: [admin]
    image: happy-filler:local
    user: "${FILLER_OPERATOR_UID:-1989}:${FILLER_GID:-1990}"
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits: { core: 0 }
    entrypoint: ["sh", "-euc"]
    environment:
      NODE_OPTIONS: ""
    volumes:
      - { type: volume, source: filler, target: /handoff/outbox, read_only: true, volume: { subpath: outbox } }
      - { type: volume, source: filler, target: /handoff/inbox, volume: { subpath: inbox } }
      - { type: volume, source: filler, target: /handoff/audit, read_only: true, volume: { subpath: audit } }

volumes:
  vault-data: { external: true, name: happy-vault-data }
  vault-config: { external: true, name: happy-vault-config }
  filler: { external: true, name: happy-filler }
