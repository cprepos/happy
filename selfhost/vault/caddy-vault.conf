# Vaultwarden for the Bitwarden apps (selfhost/vault). Own subdomain, so the web
# vault never shares an origin with the other apps on girthbass.duckdns.org.
# The admin panel is never served here: it is only on http://127.0.0.1:8222/admin.
# Added by make vault-caddy-apply (selfhost/vault/scripts/vault-caddy-apply.sh).
vault.girthbass.duckdns.org {
    tls {
        protocols tls1.2 tls1.3
    }
    @admin path /admin /admin/*
    respond @admin 404
    header {
        Strict-Transport-Security "max-age=31536000"
        X-Robots-Tag "noindex, nofollow"
        -Server
    }
    reverse_proxy 127.0.0.1:8222 {
        header_up X-Real-IP {remote_host}
    }
}
