# LiveKit server config for the self-hosted voice stack.
# Keys are NOT stored here: they come from LIVEKIT_KEYS ("<key>: <secret>"),
# which compose.voice.yml builds from LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.voice.
#
# LiveKit is internal only. Apps never talk to it: they stream audio to happy-server
# (wss://happy.../v1/voice/stream), which joins the room for them. The container sits on the
# happy-selfhost docker network, so:
# - happy-server reaches signaling at ws://livekit:7880 and media at the container IP;
# - the voice agent (host network) reaches signaling through the 127.0.0.1:7880 publish and
#   media at the container IP (host -> bridge traffic, not filtered by ufw).
# Nothing else is published: no TLS site, no ufw rules, no router forwards.
port: 7880
rtc:
  # Container-internal ports; not published on the host.
  tcp_port: 7881
  udp_port: 7882
  # No STUN lookup and no LAN/VPN addresses: the only ICE candidates are the container's
  # address on the docker network (LiveKit picks it up as its node IP).
  use_external_ip: false
  ips:
    includes:
      - 172.24.0.0/16
logging:
  level: info
  json: false
room:
  empty_timeout: 300
  departure_timeout: 20
