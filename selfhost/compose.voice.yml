# Self-hosted voice stack: LiveKit (media/signaling), STT (Nemotron streaming),
# TTS (Kokoro-FastAPI), LLM (vLLM).  Run via `make voice-up` (see voice.mk):
#   docker compose -p happy-voice -f compose.voice.yml --env-file .env.voice up -d
# Contract for consumers: VOICE_SERVICES.md
name: happy-voice

x-hf-cache: &hf-cache
  - ${HF_CACHE_DIR:-/mnt/ai-data/huggingface}:/hf-cache

services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: happy-voice-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set in .env.voice}: ${LIVEKIT_API_SECRET:?set in .env.voice}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # On happy-server's network (the happy-selfhost project must be up first), reachable there
    # as ws://livekit:7880. The address is assigned by Docker: this network has no user
    # configured subnet, so Docker refuses a fixed ipv4_address. LiveKit advertises whatever
    # address it gets (rtc.ips.includes in livekit.yaml covers the whole subnet).
    networks:
      happy:
        aliases: [livekit]
    # Signaling for the voice agent on the host network only. RTC ports (7881/tcp, 7882/udp)
    # stay inside the docker network: the agent reaches them at the container IP.
    ports:
      - "127.0.0.1:7880:7880"

  stt:
    build:
      context: ./stt
    image: happy-voice-stt:local
    container_name: happy-voice-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STT_PORT:-8090}:8090"
    environment:
      STT_MODEL: ${STT_MODEL:-nvidia/nemotron-speech-streaming-en-0.6b}
      STT_RIGHT_CONTEXT: ${STT_RIGHT_CONTEXT:-1}
      HF_HOME: /hf-cache
      HF_HUB_CACHE: /hf-cache
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: *hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STT_GPU:-0}"]
              capabilities: [gpu]

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.0
    container_name: happy-voice-tts
    restart: unless-stopped
    # Run as the host user (prep), not the image's uid 1001, which is another account on this host.
    user: "${VOICE_UID:-1000}:${VOICE_GID:-1000}"
    ports:
      - "127.0.0.1:${TTS_PORT:-8880}:8880"
    environment:
      USE_GPU: "true"
      HOME: /tmp/home
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp:uid=${VOICE_UID:-1000},gid=${VOICE_GID:-1000},mode=1777,exec
      - /app/api/temp_files:uid=${VOICE_UID:-1000},gid=${VOICE_GID:-1000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_GPU:-0}"]
              capabilities: [gpu]

  # Optional: the voice agent uses the host's coder vLLM by default (VOICE_LLM_BASE_URL).
  # Start this one only with --profile local-llm.
  llm:
    profiles: ["local-llm"]
    image: vllm/vllm-openai:v0.32.0
    container_name: happy-voice-llm
    restart: unless-stopped
    ipc: host
    # GPU 0 is shared with STT/TTS: start after them so vLLM sizes its KV cache
    # around the memory they already hold.
    depends_on:
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LLM_PORT:-8000}:8000"
    environment:
      HF_HOME: /hf-cache
      HF_HUB_CACHE: /hf-cache
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    volumes:
      - ${HF_CACHE_DIR:-/mnt/ai-data/huggingface}:/hf-cache
      - vllm-cache:/root/.cache/vllm
    command:
      - ${LLM_MODEL:-QuantTrio/Qwen3.6-35B-A3B-AWQ}
      - --served-model-name
      - ${LLM_SERVED_NAME:-voice-llm}
      - ${LLM_MODEL:-QuantTrio/Qwen3.6-35B-A3B-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "${LLM_MAX_MODEL_LEN:-32768}"
      - --gpu-memory-utilization
      - "${LLM_GPU_MEM_UTIL:-0.68}"
      - --language-model-only
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 900s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_GPU_A:-0}", "${LLM_GPU_B:-1}"]
              capabilities: [gpu]

  # LiveKit Agents worker (packages/happy-voice-agent). CPU only; host network so it reaches
  # livekit signaling, stt, tts and llm on 127.0.0.1 (LiveKit media goes to the container IP
  # on the happy-selfhost bridge). Dispatched explicitly as "happy-voice".
  voice-agent:
    build:
      context: ../packages/happy-voice-agent
    image: happy-voice-agent:local
    container_name: happy-voice-agent
    restart: unless-stopped
    network_mode: host
    env_file: .env.voice
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      # Full URL overrides (e.g. the prep-air Mac services in .env.voice); the loopback
      # defaults apply when unset.
      STT_URL: ${STT_URL:-ws://127.0.0.1:${STT_PORT:-8090}/v1/stream}
      TTS_URL: ${TTS_URL:-http://127.0.0.1:${TTS_PORT:-8880}/v1}
      # default: the host's coder vLLM (systemd); .env.voice's LLM_MODEL is the local-llm
      # profile's HF weights id, so the agent reads VOICE_LLM_* instead
      LLM_BASE_URL: ${VOICE_LLM_BASE_URL:-http://127.0.0.1:9080/v1}
      LLM_MODEL: ${VOICE_LLM_MODEL:-coder}
      # default Kokoro voice/speed when the app does not pick one for the chat; a blend such
      # as "am_michael(2)+am_onyx(1)" mixes voices by weight
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      TTS_SPEED: ${TTS_SPEED:-1.0}
      VOICE_AGENT_NAME: happy-voice
      # the worker's health/debug HTTP server; 8081 is commonly taken on shared hosts
      VOICE_AGENT_HTTP_PORT: ${VOICE_AGENT_HTTP_PORT:-8791}

networks:
  # happy-server's compose network (selfhost/docker-compose.yml, project happy-selfhost).
  happy:
    external: true
    name: happy-selfhost_default

volumes:
  vllm-cache:
