# Override for selfhost/vault/compose.vault.yml under the happy-svc rootless daemon; only
# happy-svc-ctl passes it. In rootless Docker, network_mode: host is the daemon's own network
# namespace (rootlesskit's), not the host's. Vaultwarden joins it like the filler, bound to
# 127.0.0.1, so the filler reaches it on 127.0.0.1:8222 there and happy-svc-ctl publishes
# that one port to the host's 127.0.0.1 (ports.list). No compose port publish is left that
# could reach the LAN.
services:
  vaultwarden:
    network_mode: host
    ports: !reset []
    environment:
      ROCKET_ADDRESS: 127.0.0.1
